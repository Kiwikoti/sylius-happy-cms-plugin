services:
  _defaults:
    autowire: true
    autoconfigure: true
  Adeliom\SyliusHappyCMSPlugin\EventListener\Page\DoctrineMappingListener:
    arguments:
      - '%sylius_happy_cms.page.page_class%'
      - '%sylius_happy_cms.menu.menu.class%'
      - '%sylius_happy_cms.menu.menu_item.class%'
    tags:
      - { name: doctrine.event_listener, event: loadClassMetadata }

  sylius_happy_cms_page_admin:
    class: Adeliom\SyliusHappyCMSPlugin\Admin\Page\PageAdmin
    tags:
      - { name: form.type }
