imports:
  - { resource: services/pages.yaml }
  - { resource: services/seo.yaml }
  - { resource: services/menu.yaml }
  - { resource: services/block.yaml }
  - { resource: services/maker.yaml }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Adeliom\SyliusHappyCMSPlugin\ContextProvider\CreateSharedBlockContextProvider:
    arguments:
      - '@sylius.happy_cms.shared_block.block_collection'
    tags:
      - { name: sylius.ui.template_event.context_provider }

  sylius.happy_cms.plugin.listener.entity_route_indexer:
    class: Adeliom\SyliusHappyCMSPlugin\EventListener\EntityRouteIndexer
    arguments:
      - '@cmf_routing.orm_content_repository'
    tags:
      -   name: 'doctrine.event_listener'
          event: 'postPersist'
          priority: 500
          connection: 'default'
      -   name: 'doctrine.event_listener'
          event: 'postUpdate'
          priority: 500
          connection: 'default'

  Adeliom\SyliusHappyCMSPlugin\Services\RouteRenderService:
    alias: sylius.happy_cms.plugin.services.render

  sylius.happy_cms.plugin.services.render:
    class: Adeliom\SyliusHappyCMSPlugin\Services\RouteRenderService
    arguments:
      - "@router"
      - "@sylius.resource_controller.request_configuration_factory"
      - "@twig"
      - "@event_dispatcher"
      - "@happy_cms_seo.breadcrumb"
    public: true

  sylius.happy_cms.plugin.controller.render:
    class: Adeliom\SyliusHappyCMSPlugin\Controller\Routing\RenderController
    arguments:
      - "@sylius.happy_cms.plugin.services.render"
    public: true

  Adeliom\SyliusHappyCMSPlugin\Asset\AssetHappyCMSPackage:
    tags:
      -   assets.package: { package: 'sylius.happy.cms.assets.package' }

  Adeliom\SyliusHappyCMSPlugin\Security\ContentDocumentVoter:
    tags:
      - "security.voter"

  Adeliom\SyliusHappyCMSPlugin\Routing\MediaLoader:
    tags: [ routing.loader ]


  # pages
  # ===============================


  # todo interface alias
  sylius.happy_cms.page.all_pages:
    class: Adeliom\SyliusHappyCMSPlugin\Doctrine\Query\Page\AllPages
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@sylius_admin.context.locale.admin_based"
      - "@sylius.translation_locale_provider"

  # todo interface alias
  sylius.happy_cms.admin.page_tree.tree:
    class: Adeliom\SyliusHappyCMSPlugin\Twig\Components\PageTree\TreeComponent
    arguments:
      - "@sylius.happy_cms.page.all_pages"
      - "@sylius_happy_cms.repository.page"
      - "@sylius_happy_cms.manager.page"
    tags:
      - { name: sylius.live_component.admin, key: happycms:page-tree:tree }

  # todo interface alias
  sylius.happy_cms.admin.page_tree.delete:
    class: Adeliom\SyliusHappyCMSPlugin\Twig\Components\PageTree\DeleteComponent
    arguments:
      - "@security.csrf.token_manager"
    tags:
      - { name: sylius.live_component.admin, key: happycms:page-tree:delete }
#    <call method="setLiveResponder">
#    <argument type="service" id="ux.live_component.live_responder"/>
#    </call>

