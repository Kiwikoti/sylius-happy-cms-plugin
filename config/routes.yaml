happy_cms_page_admin:
  resource: |
    alias: happy_cms.page
    section: admin
    templates: "@SyliusEasyCrudPlugin\\crud"
    redirect: update
    grid: happy_cms_page_admin
    form: 
        type: App\Admin\HappyCMS\Page\PageAdmin
        options:
            context: $context
    vars:
        all:
            icon: 'file'
            subheader: happy_cms.page.admin.ui.subheader
            breadcrumb: happy_cms.page.admin.ui.index
            templates:
                form: "@SyliusEasyCrudPlugin\\crud\\form\\_form.html.twig"
        index:
            header: happy_cms.page.admin.ui.index
        create:
            header: happy_cms.page.admin.ui.create
        update:
            header: happy_cms.page.admin.ui.update
            redirect: 
                route: update
                parameters:
                    context: $context
                    id: $id
            route:
                parameters:
                    context: $context
                    id: $id
  type: sylius.resource
  prefix: admin

