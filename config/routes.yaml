happy_cms_admin_menu_item_index:
  path: /admin/menu-items/
  methods: [ GET ]
  defaults:
    _controller: Adeliom\SyliusHappyCMSPlugin\Controller\MenuItem\MenuItemController::indexAction
    route: happy_cms_admin_menu_index
    permanent: true

happy_cms_admin_partial_menu_item_tree:
  path: /tree
  methods: [GET]
  defaults:
    _controller: Adeliom\SyliusHappyCMSPlugin\Controller\MenuItem\MenuItemController::treeAction
    _sylius:
      template: $template
      menu: $menu
      vars: $vars
      permission: true

happy_cms_admin_menu_item_update_move_up:
  path: /admin/menu-items/{id}/move-up
  methods: [PUT]
  defaults:
    _controller: Adeliom\SyliusHappyCMSPlugin\Controller\MenuItem\MenuItemController::moveUpAction
    _format: json
    _sylius:
      permission: true

happy_cms_admin_menu_item_update_move_down:
  path: /admin/menu-items/{id}/move-down
  methods: [PUT]
  defaults:
    _controller: Adeliom\SyliusHappyCMSPlugin\Controller\MenuItem\MenuItemController::moveDownAction
    _format: json
    _sylius:
      permission: true


